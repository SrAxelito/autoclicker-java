name: Compilar

# - En cada push a main/develop y en cada Pull Request: compila en Windows,
#   macOS y Linux para comprobar que nada se rompió.
# - Al subir una etiqueta vX.Y.Z: además publica los ejecutables en un Release.
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar en ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Calcular versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: construir.bat ${{ steps.version.outputs.valor }}

      - name: Compilar (macOS y Linux)
        if: runner.os != 'Windows'
        run: bash construir.sh ${{ steps.version.outputs.valor }}

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            ${{ runner.os == 'Linux' && 'dist/*.jar' || '' }}

  publicar:
    name: Publicar Release
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
